name: Completer un puit existant
description: Proposer une correction, precision ou ajout d'information pour un puit deja reference
title: "[Contribution] Puit ID <a choisir> - <resume>"
labels:
  - contribution
  - puit
  - id-existant
  - a-verifier
body:
  - type: markdown
    attributes:
      value: |
        Merci pour votre contribution.

        Ce formulaire sert uniquement a completer un puit deja present dans la base.
        Si le puit n'existe pas encore dans la liste, utilisez le formulaire "Nouveau point".

