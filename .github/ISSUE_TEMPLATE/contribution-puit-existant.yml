  - type: checkboxes
    id: update_type
    attributes:
      label: Type de contribution
      options:
        - label: Correction de nom / toponyme
        - label: Correction de position
        - label: Correction de type (puit, pompe, citerne, etc.)
        - label: Mise à jour du statut (existant, détruit, à déterminer)
        - label: Ajout de description / usage
        - label: Ajout de source bibliographique
        - label: Ajout de photo / média
    validations:
      required: true

  - type: textarea
    id: proposition
    attributes:
      label: Information proposée
      description: écrivez précisément ce qui doit être modifié/ajouté
      placeholder: |
        Exemple:
        - Nouveau nom: ...
        - Correction proposée: ...
        - Contexte: ...
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: Source(s)
      description: Indiquez une source (archive, témoignage date, relevé terrain, photo, etc.)
      placeholder: Auteur, date, lien, référence
    validations:
      required: true

  - type: input
    id: contact
    attributes:
      label: Nom ou pseudo (optionnel)
      description: Pour les crédits si votre contribution est integrée

  - type: checkboxes
    id: rights
    attributes:
      label: Autorisation
      options:
        - label: J'autorise l'utilisation des informations transmises dans ce dépôt sous licence ouverte
          required: true
