name: Update Puits Issue Template

on:
  workflow_dispatch:
  push:
    paths:
      - data/puits.geojson
      - scripts/generate-issue-template-puits-fids.js

permissions:
  contents: write

jobs:
  regenerate-puits-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate puits issue template
        run: node scripts/generate-issue-template-puits-fids.js

      - name: Commit updated template
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update puits issue template IDs"
          file_pattern: .github/ISSUE_TEMPLATE/contribution-puit-existant.yml
